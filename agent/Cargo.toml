[package]
name = "fleet-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Node-side agent for openchamber-fleet: a process spoken to over SSH stdio."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
