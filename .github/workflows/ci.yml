name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust format
        run: cargo fmt --manifest-path agent/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path agent/Cargo.toml
      - name: Build agent
        run: cargo build --manifest-path agent/Cargo.toml
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          FLEET_AGENT_BIN: agent/target/debug/fleet-agent
      - name: Bundles match the TypeScript sources
        run: git diff --exit-code extensions/openchamber/plugin/dist extensions/openchamber/service extensions/openchamber/supervisor

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v32
      - name: Run the declared flake gate
        run: nix flake check --max-jobs 1 --print-build-logs

  darwin:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v32
      - name: Run the declared flake gate on Darwin
        run: nix flake check --max-jobs 1 --print-build-logs
