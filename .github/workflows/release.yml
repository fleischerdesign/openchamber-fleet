name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test --manifest-path agent/Cargo.toml
      - name: Build agent
        run: cargo build --manifest-path agent/Cargo.toml
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          FLEET_AGENT_BIN: agent/target/debug/fleet-agent
      - name: Package the portable extension
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="$(node -p 'require("./package.json").version')"
          fi
          mkdir -p release
          npm pack --pack-destination release
          (cd extensions/openchamber && zip -qr "../../release/openchamber-fleet-extension-${version}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: release/*
          if-no-files-found: error

  agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build with cargo
        if: matrix.cross == false
        run: cargo build --release --locked --manifest-path agent/Cargo.toml --target ${{ matrix.target }}
      - name: Build with cross
        if: matrix.cross == true
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--release --locked --manifest-path agent/Cargo.toml"
      - name: Stage the binary
        run: |
          mkdir -p dist
          cp "agent/target/${{ matrix.target }}/release/fleet-agent" "dist/fleet-agent-${{ matrix.target }}"
          chmod +x "dist/fleet-agent-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-agent-${{ matrix.target }}
          path: dist/fleet-agent-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: [extension, agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Write checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
